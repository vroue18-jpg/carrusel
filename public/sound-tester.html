<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Sound Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0d14;
    color: #fff;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 12px;
  }
  h1 { font-size: 1.3rem; color: #e8620a; letter-spacing: 0.15em; margin-bottom: 4px; }
  p { color: rgba(255,255,255,0.35); font-size: 0.8rem; margin-bottom: 20px; text-align: center; }
  .btn {
    width: 340px;
    padding: 14px 20px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 3px;
    transition: all 0.15s;
    text-align: left;
  }
  .btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(232,98,10,0.4); }
  .btn:active { transform: scale(0.97); }
  .btn .name { font-weight: 600; font-size: 0.95rem; }
  .btn .desc { color: rgba(255,255,255,0.3); font-size: 0.72rem; }
</style>
</head>
<body>
<h1>🔑 Key Sound Tester</h1>
<p>Click to preview each sound. Tell me which one you like!</p>

<button class="btn" onclick="playSnap()">
  <span class="name">1 · Snap Click</span>
  <span class="desc">Single sharp metallic snap — very short (&lt;100ms)</span>
</button>

<button class="btn" onclick="playClickClack()">
  <span class="name">2 · Click + Clack</span>
  <span class="desc">Two-hit: insertion tick then lock clack (~200ms)</span>
</button>

<button class="btn" onclick="playScrapeClick()">
  <span class="name">3 · Scrape + Click</span>
  <span class="desc">Brief metal scrape as it turns, ends with click (~250ms)</span>
</button>

<button class="btn" onclick="playThunk()">
  <span class="name">4 · Heavy Thunk</span>
  <span class="desc">Solid low-end mechanical thunk, like a deadbolt (~150ms)</span>
</button>

<button class="btn" onclick="playTick()">
  <span class="name">5 · Crisp Tick</span>
  <span class="desc">Thin, precise metal tick — minimal and clean (~80ms)</span>
</button>

<button class="btn" onclick="playRatchet()">
  <span class="name">6 · Ratchet</span>
  <span class="desc">Two quick ratchet clicks, like a bike lock (~180ms)</span>
</button>

<button class="btn" onclick="playBrass()">
  <span class="name">7 · Brass Ring</span>
  <span class="desc">Soft brass impact with a warm ring decay (~300ms)</span>
</button>

<button class="btn" onclick="playSafe()">
  <span class="name">8 · Safe Lock</span>
  <span class="desc">Deep click + heavy bolt settling, premium feel (~280ms)</span>
</button>

<script>
let ctx;
function getCtx() {
  if (!ctx) ctx = new AudioContext();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function noise(c, dur) {
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function chain(nodes) {
  for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i+1]);
}

// 1 · Single sharp metallic snap
function playSnap() {
  const c = getCtx(), t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = noise(c, 0.018);
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
  const g = c.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
  chain([src, hp, lp, g, c.destination]);
  src.start(t); src.stop(t + 0.08);
}

// 2 · Click + Clack (two hits)
function playClickClack() {
  const c = getCtx(), t = c.currentTime;
  // Insert click
  const s1 = c.createBufferSource(); s1.buffer = noise(c, 0.012);
  const f1 = c.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 3200; f1.Q.value = 2;
  const g1 = c.createGain(); g1.gain.setValueAtTime(0.5, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  chain([s1, f1, g1, c.destination]); s1.start(t); s1.stop(t + 0.06);
  // Lock clack
  const s2 = c.createBufferSource(); s2.buffer = noise(c, 0.02);
  const f2 = c.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 800; f2.Q.value = 1.5;
  const g2 = c.createGain(); g2.gain.setValueAtTime(0.55, t+0.16); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
  chain([s2, f2, g2, c.destination]); s2.start(t+0.16); s2.stop(t + 0.23);
  // Ring on clack
  const o = c.createOscillator(), og = c.createGain();
  o.type = 'sine'; o.frequency.value = 980;
  og.gain.setValueAtTime(0.0001, t+0.16); og.gain.linearRampToValueAtTime(0.08, t+0.164); og.gain.exponentialRampToValueAtTime(0.001, t+0.32);
  chain([o, og, c.destination]); o.start(t+0.16); o.stop(t+0.35);
}

// 3 · Scrape + Click
function playScrapeClick() {
  const c = getCtx(), t = c.currentTime;
  const scr = c.createBufferSource(); scr.buffer = noise(c, 0.14);
  const sf = c.createBiquadFilter(); sf.type = 'bandpass'; sf.Q.value = 5;
  sf.frequency.setValueAtTime(1100, t); sf.frequency.linearRampToValueAtTime(650, t+0.14);
  const sg = c.createGain(); sg.gain.setValueAtTime(0.0001, t); sg.gain.linearRampToValueAtTime(0.06, t+0.03); sg.gain.exponentialRampToValueAtTime(0.001, t+0.14);
  chain([scr, sf, sg, c.destination]); scr.start(t); scr.stop(t+0.16);
  // Final click
  const ck = c.createBufferSource(); ck.buffer = noise(c, 0.015);
  const ckf = c.createBiquadFilter(); ckf.type = 'lowpass'; ckf.frequency.value = 2000;
  const ckg = c.createGain(); ckg.gain.setValueAtTime(0.5, t+0.15); ckg.gain.exponentialRampToValueAtTime(0.001, t+0.22);
  chain([ck, ckf, ckg, c.destination]); ck.start(t+0.15); ck.stop(t+0.23);
}

// 4 · Heavy Thunk (deadbolt)
function playThunk() {
  const c = getCtx(), t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = noise(c, 0.025);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
  const g = c.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.13);
  chain([src, lp, g, c.destination]); src.start(t); src.stop(t+0.14);
  const sub = c.createOscillator(), sg = c.createGain();
  sub.type = 'sine'; sub.frequency.setValueAtTime(90, t); sub.frequency.exponentialRampToValueAtTime(40, t+0.12);
  sg.gain.setValueAtTime(0.35, t); sg.gain.exponentialRampToValueAtTime(0.001, t+0.15);
  chain([sub, sg, c.destination]); sub.start(t); sub.stop(t+0.16);
}

// 5 · Crisp Tick
function playTick() {
  const c = getCtx(), t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = noise(c, 0.008);
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3500;
  const g = c.createGain(); g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.045);
  chain([src, hp, g, c.destination]); src.start(t); src.stop(t+0.05);
  const o = c.createOscillator(), og = c.createGain();
  o.type = 'sine'; o.frequency.value = 2800;
  og.gain.setValueAtTime(0.0001, t); og.gain.linearRampToValueAtTime(0.05, t+0.003); og.gain.exponentialRampToValueAtTime(0.001, t+0.06);
  chain([o, og, c.destination]); o.start(t); o.stop(t+0.07);
}

// 6 · Ratchet (two quick clicks)
function playRatchet() {
  const c = getCtx(), t = c.currentTime;
  [0, 0.1].forEach(delay => {
    const src = c.createBufferSource(); src.buffer = noise(c, 0.012);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 3;
    const g = c.createGain(); g.gain.setValueAtTime(0.45, t+delay); g.gain.exponentialRampToValueAtTime(0.001, t+delay+0.06);
    chain([src, bp, g, c.destination]); src.start(t+delay); src.stop(t+delay+0.07);
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'sine'; o.frequency.value = 1200;
    og.gain.setValueAtTime(0.0001, t+delay); og.gain.linearRampToValueAtTime(0.04, t+delay+0.003); og.gain.exponentialRampToValueAtTime(0.001, t+delay+0.07);
    chain([o, og, c.destination]); o.start(t+delay); o.stop(t+delay+0.08);
  });
}

// 7 · Brass Ring
function playBrass() {
  const c = getCtx(), t = c.currentTime;
  const src = c.createBufferSource(); src.buffer = noise(c, 0.02);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 1.2;
  const g = c.createGain(); g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.07);
  chain([src, bp, g, c.destination]); src.start(t); src.stop(t+0.08);
  [520, 1050, 2100].forEach((freq, i) => {
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    const vol = [0.14, 0.07, 0.03][i];
    const dec = [0.28, 0.18, 0.10][i];
    og.gain.setValueAtTime(0.0001, t); og.gain.linearRampToValueAtTime(vol, t+0.005); og.gain.exponentialRampToValueAtTime(0.001, t+dec);
    chain([o, og, c.destination]); o.start(t); o.stop(t+dec+0.01);
  });
}

// 8 · Safe Lock (deep click + bolt)
function playSafe() {
  const c = getCtx(), t = c.currentTime;
  // Body impact
  const s1 = c.createBufferSource(); s1.buffer = noise(c, 0.022);
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 200;
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
  const g1 = c.createGain(); g1.gain.setValueAtTime(0.6, t); g1.gain.exponentialRampToValueAtTime(0.001, t+0.09);
  chain([s1, hp, lp, g1, c.destination]); s1.start(t); s1.stop(t+0.1);
  // Deep resonance
  const sub = c.createOscillator(), sg = c.createGain();
  sub.type = 'sine'; sub.frequency.setValueAtTime(110, t); sub.frequency.exponentialRampToValueAtTime(55, t+0.18);
  sg.gain.setValueAtTime(0.28, t); sg.gain.exponentialRampToValueAtTime(0.001, t+0.2);
  chain([sub, sg, c.destination]); sub.start(t); sub.stop(t+0.22);
  // Bolt settling micro-click
  const s2 = c.createBufferSource(); s2.buffer = noise(c, 0.01);
  const bf = c.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = 1400; bf.Q.value = 2;
  const g2 = c.createGain(); g2.gain.setValueAtTime(0.25, t+0.19); g2.gain.exponentialRampToValueAtTime(0.001, t+0.27);
  chain([s2, bf, g2, c.destination]); s2.start(t+0.19); s2.stop(t+0.28);
}
</script>
</body>
</html>
